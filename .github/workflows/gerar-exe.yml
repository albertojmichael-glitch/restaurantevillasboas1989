name: Gerar Executáveis Multiplataforma

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: PizzariaTycoon-Windows-x64
          - os: ubuntu-latest
            rid: linux-x64
            artifact: PizzariaTycoon-Linux-x64
          - os: macos-latest
            rid: osx-x64
            artifact: PizzariaTycoon-macOS-x64

    runs-on: ${{ matrix.os }}

    steps:
    - name: Baixar código do repositório
      uses: actions/checkout@v4

    - name: Configurar .NET 8
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Executar testes antes de publicar
      run: dotnet run --project PizzariaTycoon.Tests/PizzariaTycoon.Tests.csproj -c Release

    - name: Publicar executável independente (${{ matrix.rid }})
      run: >
        dotnet publish PizzariaTycoon.csproj
        -c Release
        -r ${{ matrix.rid }}
        --self-contained true
        -p:PublishSingleFile=true
        -p:IncludeNativeLibrariesForSelfExtract=true
        -o ./saida_exe/${{ matrix.rid }}

    - name: Disponibilizar executável para download
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.artifact }}
        path: ./saida_exe/${{ matrix.rid }}
