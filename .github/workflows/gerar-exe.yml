name: Gerar Executavel Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Baixar codigo do repositorio
      uses: actions/checkout@v4

    - name: Configurar .NET 8 na nuvem
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Criar .csproj automaticamente se nao existir
      shell: pwsh
      run: |
        if (-not (Get-ChildItem -Filter *.csproj)) {
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net8.0</TargetFramework><ImplicitUsings>enable</ImplicitUsings><Nullable>disable</Nullable></PropertyGroup></Project>' | Out-File -FilePath PizzariaTycoon.csproj -Encoding utf8
        }

    - name: Compilar arquivo .exe unico e independente
      run: dotnet publish -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./saida_exe

    - name: Disponibilizar .exe para download
      uses: actions/upload-artifact@v4
      with:
        name: PizzariaTycoon-Executavel
        path: ./saida_exe/
